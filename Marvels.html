<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Slide Navigation Buttons</title>

<style>

/* ================= GLOBAL ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Arial,sans-serif;
  overflow:hidden;
}

/* ================= MAIN PAGE ================= */

.main-page{
  width:100%;
  height:100vh;

  position:relative;
}

/* Background Image */

.main-page img{
  width:100%;
  height:100%;

  object-fit:cover;
}

/* Dark Overlay */

.overlay{
  position:absolute;
  inset:0;

  background:rgba(0,0,0,0.45);
}

/* Main Title */

.title{
  position:absolute;

  top:50%;
  left:50%;

  transform:translate(-50%,-50%);

  color:#fff;

  font-size:70px;
  font-weight:bold;

  z-index:10;

  text-shadow:0 0 20px #000;
}

/* ================= SIDE BUTTONS ================= */

.side-buttons{
  position:fixed;

  top:50%;
  right:0;

  transform:translateY(-50%);

  display:flex;
  flex-direction:column;

  gap:12px;

  z-index:9999;
}

/* Remove Link Style */

.side-buttons a{
  text-decoration:none;
}

/* ================= BUTTON ================= */

.nav-btn{
  width:75px;
  height:62px;

  border:none;
  outline:none;

  overflow:hidden;

  cursor:pointer;

  background:#111;

  border-radius:18px 0 0 18px;

  transition:0.45s ease;

  position:relative;
}

/* Image */

.nav-btn img{
  width:100%;
  height:100%;

  object-fit:cover;
}

/* Hover Slide */

.nav-btn:hover{
  width:240px;

  transform:translateX(0);

  box-shadow:
  0 0 20px rgba(255,255,255,0.35);
}

/* Shine Effect */

.nav-btn::before{
  content:"";

  position:absolute;

  top:0;
  left:-100%;

  width:100%;
  height:100%;

  background:linear-gradient(
    120deg,
    transparent,
    rgba(255,255,255,0.3),
    transparent
  );

  transition:0.6s;
}

.nav-btn:hover::before{
  left:100%;
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .title{
    font-size:40px;
  }

  .nav-btn{
    width:60px;
    height:50px;
  }

  .nav-btn:hover{
    width:160px;
  }

}

</style>

</head>

<body>

<!-- ================= MAIN PAGE ================= -->

<div class="main-page">

  <img src="https://picsum.photos/id/1015/1600/900">

  <div class="overlay"></div>

  <div class="title">
    HOME PAGE
  </div>

</div>

<!-- ================= RIGHT SIDE BUTTONS ================= -->

<div class="side-buttons">

  <!-- HOME -->
  <a href="home.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1015/300/200">
    </button>
  </a>

  <!-- MOVIES -->
  <a href="movies.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1016/300/200">
    </button>
  </a>

  <!-- SERIES -->
  <a href="series.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1018/300/200">
    </button>
  </a>

  <!-- ANIME -->
  <a href="anime.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1020/300/200">
    </button>
  </a>

  <!-- MARVEL -->
  <a href="marvel.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1024/300/200">
    </button>
  </a>

  <!-- DC -->
  <a href="dc.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1025/300/200">
    </button>
  </a>

  <!-- SPORTS -->
  <a href="sports.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1035/300/200">
    </button>
  </a>

  <!-- KIDS -->
  <a href="kids.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1040/300/200">
    </button>
  </a>

  <!-- DOWNLOADS -->
  <a href="downloads.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1050/300/200">
    </button>
  </a>

  <!-- PROFILE -->
  <a href="profile.html">
    <button class="nav-btn">
      <img src="https://picsum.photos/id/1060/300/200">
    </button>
  </a>

</div>

</body>

</html>
