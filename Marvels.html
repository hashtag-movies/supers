<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4 Slide Buttons</title>

  <style>
    body{
      margin:0;
      padding:40px;
      background:#f4f4f4;
      font-family:Arial, sans-serif;
      display:flex;
      flex-direction:column;
      gap:25px;
      align-items:center;
    }

    .slider-container{
      width:350px;
      height:70px;
      background:#ddd;
      border-radius:50px;
      position:relative;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .slider-text{
      position:absolute;
      width:100%;
      text-align:center;
      line-height:70px;
      color:#555;
      font-size:20px;
      user-select:none;
    }

    .slider-btn{
      width:70px;
      height:70px;
      border-radius:50%;
      position:absolute;
      right:0;
      top:0;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:28px;
      font-weight:bold;
      user-select:none;
    }

    .blue{ background:#007bff; }
    .green{ background:#28a745; }
    .red{ background:#dc3545; }
    .orange{ background:#fd7e14; }
  </style>
</head>
<body>

  <!-- BUTTON 1 -->
  <div class="slider-container">
    <div class="slider-text">Slide for Google</div>
    <div class="slider-btn blue" data-url="https://google.com">◀</div>
  </div>

  <!-- BUTTON 2 -->
  <div class="slider-container">
    <div class="slider-text">Slide for YouTube</div>
    <div class="slider-btn green" data-url="https://youtube.com">◀</div>
  </div>

  <!-- BUTTON 3 -->
  <div class="slider-container">
    <div class="slider-text">Slide for Facebook</div>
    <div class="slider-btn red" data-url="https://facebook.com">◀</div>
  </div>

  <!-- BUTTON 4 -->
  <div class="slider-container">
    <div class="slider-text">Slide for OpenAI</div>
    <div class="slider-btn orange" data-url="https://openai.com">◀</div>
  </div>

  <script>
    const sliders = document.querySelectorAll(".slider-btn");

    sliders.forEach(slider => {

      let isDragging = false;
      let startX = 0;

      slider.addEventListener("mousedown", (e) => {
        isDragging = true;
        startX = e.clientX;
      });

      document.addEventListener("mousemove", (e) => {
        if (!isDragging) return;

        let moveX = startX - e.clientX;

        if (moveX < 0) moveX = 0;
        if (moveX > 280) moveX = 280;

        slider.style.right = moveX + "px";

        // Redirect when fully slid
        if (moveX >= 270) {
          window.location.href = slider.dataset.url;
        }
      });

      document.addEventListener("mouseup", () => {
        if (!isDragging) return;

        isDragging = false;
        slider.style.right = "0px";
      });

    });
  </script>

</body>
</html>
