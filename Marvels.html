<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Slide Buttons</title>

  <style>
    body{
      margin:0;
      height:100vh;
      background:#f4f4f4;
      font-family:Arial, sans-serif;
    }

    /* RIGHT SIDE CONTAINER */
    .floating-buttons{
      position:fixed;
      right:20px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      gap:20px;
      z-index:999;
    }

    /* SLIDER AREA */
    .slider-container{
      width:260px;
      height:70px;
      position:relative;
      overflow:hidden;
    }

    /* HIDDEN BACKGROUND */
    .slider-track{
      position:absolute;
      right:0;
      top:0;
      width:260px;
      height:70px;
      border-radius:50px;
      background:#ddd;
      display:flex;
      align-items:center;
      justify-content:center;
      color:#555;
      font-size:18px;
      opacity:0;
      transition:0.3s;
    }

    /* ROUND BUTTON */
    .slider-btn{
      width:70px;
      height:70px;
      border-radius:50%;
      position:absolute;
      right:0;
      top:0;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:28px;
      font-weight:bold;
      user-select:none;
      touch-action:none;
      z-index:2;
      transition:right 0.2s ease;
      box-shadow:0 4px 10px rgba(0,0,0,0.25);
    }

    /* SHOW TRACK ON HOVER */
    .slider-container:hover .slider-track{
      opacity:1;
    }

    .blue{ background:#007bff; }
    .green{ background:#28a745; }
    .red{ background:#dc3545; }
    .orange{ background:#fd7e14; }

    @media(max-width:600px){
      .slider-container{
        width:220px;
      }

      .slider-track{
        width:220px;
        font-size:16px;
      }

      .slider-btn{
        width:65px;
        height:65px;
      }
    }
  </style>
</head>
<body>

  <div class="floating-buttons">

    <!-- GOOGLE -->
    <div class="slider-container">
      <div class="slider-track">Slide for Google</div>
      <div class="slider-btn blue" data-url="https://google.com">◀</div>
    </div>

    <!-- YOUTUBE -->
    <div class="slider-container">
      <div class="slider-track">Slide for YouTube</div>
      <div class="slider-btn green" data-url="https://youtube.com">◀</div>
    </div>

    <!-- FACEBOOK -->
    <div class="slider-container">
      <div class="slider-track">Slide for Facebook</div>
      <div class="slider-btn red" data-url="https://facebook.com">◀</div>
    </div>

    <!-- OPENAI -->
    <div class="slider-container">
      <div class="slider-track">Slide for OpenAI</div>
      <div class="slider-btn orange" data-url="https://openai.com">◀</div>
    </div>

  </div>

  <script>
    const sliders = document.querySelectorAll(".slider-btn");

    sliders.forEach(slider => {

      let isDragging = false;
      let startX = 0;
      let maxMove = 0;

      const container = slider.parentElement;
      const track = container.querySelector(".slider-track");

      function startDrag(clientX){
        isDragging = true;
        startX = clientX;

        maxMove = container.offsetWidth - slider.offsetWidth;

        slider.style.transition = "none";
        track.style.opacity = "1";
      }

      function moveDrag(clientX){
        if(!isDragging) return;

        let moveX = startX - clientX;

        if(moveX < 0) moveX = 0;
        if(moveX > maxMove) moveX = maxMove;

        slider.style.right = moveX + "px";

        // Redirect when fully slid
        if(moveX >= maxMove - 10){
          window.location.href = slider.dataset.url;
        }
      }

      function stopDrag(){
        if(!isDragging) return;

        isDragging = false;

        slider.style.transition = "right 0.25s ease";
        slider.style.right = "0px";

        track.style.opacity = "0";
      }

      // Desktop
      slider.addEventListener("mousedown", (e)=>{
        startDrag(e.clientX);
      });

      document.addEventListener("mousemove", (e)=>{
        moveDrag(e.clientX);
      });

      document.addEventListener("mouseup", stopDrag);

      // Mobile
      slider.addEventListener("touchstart", (e)=>{
        startDrag(e.touches[0].clientX);
      });

      document.addEventListener("touchmove", (e)=>{
        moveDrag(e.touches[0].clientX);
      }, { passive:false });

      document.addEventListener("touchend", stopDrag);

    });
  </script>

</body>
</html>
