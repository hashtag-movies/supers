<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>4 Slide Buttons</title>

  <style>
    body{
      margin:0;
      padding:40px;
      background:#f4f4f4;
      font-family:Arial, sans-serif;
      display:flex;
      flex-direction:column;
      gap:25px;
      align-items:center;
    }

    .slider-container{
      width:350px;
      height:70px;
      background:#ddd;
      border-radius:50px;
      position:relative;
      overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.2);
    }

    .slider-text{
      position:absolute;
      width:100%;
      text-align:center;
      line-height:70px;
      color:#555;
      font-size:20px;
      user-select:none;
      pointer-events:none;
    }

    .slider-btn{
      width:70px;
      height:70px;
      border-radius:50%;
      position:absolute;
      right:0;
      top:0;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      color:white;
      font-size:28px;
      font-weight:bold;
      user-select:none;
      touch-action:none;
      transition:right 0.2s ease;
    }

    .blue{ background:#007bff; }
    .green{ background:#28a745; }
    .red{ background:#dc3545; }
    .orange{ background:#fd7e14; }

    @media(max-width:400px){
      .slider-container{
        width:90%;
      }
    }
  </style>
</head>
<body>

  <!-- BUTTON 1 -->
  <div class="slider-container">
    <div class="slider-text">Slide for Google</div>
    <div class="slider-btn blue" data-url="https://google.com">◀</div>
  </div>

  <!-- BUTTON 2 -->
  <div class="slider-container">
    <div class="slider-text">Slide for YouTube</div>
    <div class="slider-btn green" data-url="https://youtube.com">◀</div>
  </div>

  <!-- BUTTON 3 -->
  <div class="slider-container">
    <div class="slider-text">Slide for Facebook</div>
    <div class="slider-btn red" data-url="https://facebook.com">◀</div>
  </div>

  <!-- BUTTON 4 -->
  <div class="slider-container">
    <div class="slider-text">Slide for OpenAI</div>
    <div class="slider-btn orange" data-url="https://openai.com">◀</div>
  </div>

  <script>
    const sliders = document.querySelectorAll(".slider-btn");

    sliders.forEach(slider => {

      let isDragging = false;
      let startX = 0;
      let maxMove = 0;

      const container = slider.parentElement;

      function startDrag(clientX){
        isDragging = true;
        startX = clientX;

        maxMove = container.offsetWidth - slider.offsetWidth;

        slider.style.transition = "none";
      }

      function moveDrag(clientX){
        if(!isDragging) return;

        let moveX = startX - clientX;

        if(moveX < 0) moveX = 0;
        if(moveX > maxMove) moveX = maxMove;

        slider.style.right = moveX + "px";

        // Redirect when fully slid
        if(moveX >= maxMove - 10){
          window.location.href = slider.dataset.url;
        }
      }

      function stopDrag(){
        if(!isDragging) return;

        isDragging = false;

        slider.style.transition = "right 0.2s ease";
        slider.style.right = "0px";
      }

      // Desktop Events
      slider.addEventListener("mousedown", (e) => {
        startDrag(e.clientX);
      });

      document.addEventListener("mousemove", (e) => {
        moveDrag(e.clientX);
      });

      document.addEventListener("mouseup", stopDrag);

      // Mobile Touch Events
      slider.addEventListener("touchstart", (e) => {
        startDrag(e.touches[0].clientX);
      });

      document.addEventListener("touchmove", (e) => {
        moveDrag(e.touches[0].clientX);
      }, { passive:false });

      document.addEventListener("touchend", stopDrag);

    });
  </script>

</body>
</html>
