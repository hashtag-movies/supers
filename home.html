<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashtag Movies</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ===== GLOBAL ===== */
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 60px;
  background: black;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  z-index: 1000;
}

.logo img {
  height: 40px;
}

.search img {
  height: 28px;
}

/* Space below header */
.main {
  margin-top: 60px;
}

/* ===== HERO ===== */
.carousel-item video {
  width: 100%;
  height: 60vh;
  object-fit: cover;
}

/* Dark overlay like Netflix */
.carousel-item::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background: linear-gradient(to top, black, transparent);
}

/* ===== ROWS ===== */
.row-title {
  margin: 15px;
  font-size: 18px;
}

.scroll-row {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px;
}

.scroll-row img {
  height: 160px;
  border-radius: 10px;
  transition: transform 0.3s;
}

.scroll-row img:hover {
  transform: scale(1.1);
}

/* Hide scrollbar */
.scroll-row::-webkit-scrollbar {
  display: none;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .carousel-item video {
    height: 40vh;
  }

  .scroll-row img {
    height: 120px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="logo">
    <img src="sitelogo-removebg-preview.png">
  </div>

  <div class="search">
    <a href="Search.html">
      <img src="https://i.ibb.co/mJ0nZzt/search-9-xxl.png">
    </a>
  </div>
</div>

<div class="main">

<!-- HERO CAROUSEL -->
<div id="heroCarousel" class="carousel slide" data-ride="carousel">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <video autoplay muted loop playsinline poster="poster1.jpg">
        <source src="Trailers/video1.mp4" type="video/mp4">
      </video>
    </div>

    <div class="carousel-item">
      <video autoplay muted loop playsinline poster="poster2.jpg">
        <source src="Trailers/video2.mp4" type="video/mp4">
      </video>
    </div>

  </div>

</div>

<!-- MOVIE ROW -->
<div class="row-title">Latest Movies</div>
<div class="scroll-row">
  <img src="img1.jpg">
  <img src="img2.jpg">
  <img src="img3.jpg">
  <img src="img4.jpg">
</div>

<!-- WEB SERIES -->
<div class="row-title">Web Series</div>
<div class="scroll-row">
  <img src="img5.jpg">
  <img src="img6.jpg">
  <img src="img7.jpg">
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
