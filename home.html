<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hashtag Movies</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ================= GLOBAL ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:65px;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:0 18px;

  z-index:1000;
}

/* Blur Layer */

.header-bg{
  position:absolute;
  inset:0;

  background:url('landscape-wide-7d.jpg') center/cover no-repeat;

  filter:blur(15px);
  transform:scale(1.4);

  opacity:.6;
  z-index:0;
}

/* Dark overlay */

.header::before{
  content:"";
  position:absolute;
  inset:0;

  background:rgba(0,0,0,.45);
  z-index:1;
}

/* Bottom fade */

.header::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-1px;

  width:100%;
  height:90px;

  background:linear-gradient(
    to bottom,
    rgba(0,0,0,.7),
    rgba(0,0,0,0)
  );

  z-index:1;
}

.logo,
.search{
  position:relative;
  z-index:2;
}

.logo img{
  height:42px;
}

.search img{
  height:28px;
  filter:invert(1);
}

/* ================= MAIN ================= */

.main{
  margin-top:65px;
}

/* ================= HERO ================= */

.carousel-item{
  position:relative;
}

.carousel-item video{
  width:100%;
  height:70vh;
  object-fit:cover;
}

/* Cinematic overlay */

.carousel-item::after{
  content:"";
  position:absolute;
  inset:0;

  background:
    linear-gradient(to top, #000 5%, transparent 50%),
    linear-gradient(to bottom, #000 0%, transparent 20%);
}

/* ================= SECTION ================= */

.section{
  margin-top:20px;
}

.row-title{
  font-size:20px;
  font-weight:bold;
  margin-left:15px;
  margin-bottom:10px;
}

/* ================= SCROLL ROW ================= */

.scroll-row{
  display:flex;
  gap:12px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:10px 15px 20px;
  scroll-behavior:smooth;
}

.scroll-row::-webkit-scrollbar{
  display:none;
}

.movie-card{
  flex:0 0 auto;
  transition:.35s;
}

.movie-card img{
  width:120px;
  height:180px;

  object-fit:cover;

  border-radius:10px;
}

/* Hover effect */

.movie-card:hover{
  transform:scale(1.08);
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .carousel-item video{
    height:45vh;
  }

  .movie-card img{
    width:100px;
    height:150px;
  }

  .row-title{
    font-size:18px;
  }

  .logo img{
    height:36px;
  }

}

/* ================= DESKTOP ================= */

@media(min-width:1200px){

  .movie-card img{
    width:150px;
    height:220px;
  }

}

</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<div class="header">

  <div class="header-bg"></div>

  <div class="logo">
    <img src="sitelogo-removebg-preview.png">
  </div>

  <div class="search">
    <a href="Search.html">
      <img src="https://i.ibb.co/mJ0nZzt/search-9-xxl.png">
    </a>
  </div>

</div>

<div class="main">

<!-- ================= HERO CAROUSEL ================= -->

<div id="heroCarousel"
class="carousel slide carousel-fade"
data-ride="carousel"
data-interval="5000">

  <div class="carousel-inner">

    <!-- ITEM 1 -->

    <div class="carousel-item active">

      <video autoplay muted loop playsinline>
        <source src="video/Avengers.mp4" type="video/mp4">
      </video>

    </div>

    <!-- ITEM 2 -->

    <div class="carousel-item">

      <video autoplay muted loop playsinline>
        <source src="video/Loki.mp4" type="video/mp4">
      </video>

    </div>

  </div>

</div>

<!-- ================= MOVIES ================= -->

<div class="section">

  <div class="row-title">Latest Movies</div>

  <div class="scroll-row">

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?1">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?2">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?3">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?4">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?5">
    </div>

  </div>

</div>

<!-- ================= WEB SERIES ================= -->

<div class="section">

  <div class="row-title">Web Series</div>

  <div class="scroll-row">

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?6">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?7">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?8">
    </div>

    <div class="movie-card">
      <img src="https://picsum.photos/300/400?9">
    </div>

  </div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
