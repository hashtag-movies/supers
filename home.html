<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hashtag Movies</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ================= GLOBAL ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.header {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 60px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 15px;

  z-index: 1000;

  background: transparent;
}

/* REMOVE OLD BACKGROUND */
.header-bg {
  display: none;
}

/* Logo + Search Container */

.logo,
.search {
  position: relative;
  z-index: 2;

  padding: 8px 12px;

  border-radius: 12px;

  /* Blur only behind logo/search */
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  background: rgba(0,0,0,0.25);
}

/* Logo image */
.logo img {
  height: 40px;
}

/* Search image */
.search img {
  height: 28px;
 
}

/* Optional soft bottom fade */
.header::after {
  content: "";
  position: absolute;

  left: 0;
  bottom: -1px;

  width: 100%;
  height: 100px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.4),
    rgba(0,0,0,0)
  );

  pointer-events: none;
}

/* ================= MAIN ================= */

.main{
  margin-top:65px;
}

/* ================= HERO ================= */

.carousel-item {
  position: relative;
  overflow: hidden;
  background: #000;
}

/* Desktop */

.carousel-item video {
  width: 100%;
  height: 75vh;
  object-fit: cover;
}

/* Cinematic overlay */

.carousel-item::after {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(to top, rgba(0,0,0,0.95), transparent 45%),
    linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 20%);
}

/* ================= MOBILE FIX ================= */

@media (max-width: 768px) {

  .carousel-item video {

    /* Better mobile height */
    height: 55vh;

    /* Prevent ugly crop */
    object-fit: contain;

    background: #000;
  }

  /* Add side fade for empty space */

  .carousel-item::before {
    content: "";
    position: absolute;
    inset: 0;

    background:
      linear-gradient(to right,
      rgba(0,0,0,0.9),
      transparent 20%,
      transparent 80%,
      rgba(0,0,0,0.9));

    z-index: 1;
  }

}

/* ================= SECTION ================= */

.section{
  margin-top:20px;
}

.row-title{
  font-size:20px;
  font-weight:bold;
  margin-left:15px;
  margin-bottom:10px;
}

/* ================= SCROLL ROW ================= */

.scroll-row{
  display:flex;
  gap:12px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:10px 15px 20px;
  scroll-behavior:smooth;
}

.scroll-row::-webkit-scrollbar{
  display:none;
}

.movie-card{
  flex:0 0 auto;
  transition:.35s;
}

.movie-card img{
  width:120px;
  height:180px;

  object-fit:cover;

  border-radius:10px;
}

/* Hover effect */

.movie-card:hover{
  transform:scale(1.08);
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .carousel-item video{
    height:45vh;
  }

  .movie-card img{
    width:100px;
    height:150px;
  }

  .row-title{
    font-size:18px;
  }

  .logo img{
    height:36px;
  }

}

/* ================= DESKTOP ================= */

@media(min-width:1200px){

  .movie-card img{
    width:150px;
    height:220px;
  }

}
  
/* ================= FEATURED CONTAINER ================= */

.featured-container {

  width: 95%;
  margin: 25px auto;

  padding: 20px;

  border-radius: 18px;

  background: rgba(255,255,255,0.04);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border: 1px solid rgba(255,255,255,0.08);
}

/* ================= IMAGE ROW ================= */

.featured-row {

  display: flex;
  justify-content: center;
  gap: 15px;

  flex-wrap: wrap;
}

/* Images */

.featured-row img {

  width: 23%;
  height: 220px;

  object-fit: cover;

  border-radius: 14px;

  transition: 0.35s;
  cursor: pointer;
}

/* Hover Effect */

.featured-row img:hover {
  transform: scale(1.03);
}

/* ================= TABLET ================= */

@media (max-width: 992px) {

  .featured-row img {

    width: 48%;
    height: 180px;
  }

}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .featured-container {

    width: 98%;
    padding: 12px;

    border-radius: 14px;
  }

  .featured-row {

    gap: 10px;
  }

  .featured-row img {

    width: 23%;
    height: 60px;

    border-radius: 10px;
  }

}
</style>
</head>
