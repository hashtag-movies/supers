<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashtag Movies</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ================= GLOBAL ================= */
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial;
}

/* ================= HEADER ================= */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 60px;

  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;

  z-index: 1000;
  overflow: hidden;
  background: transparent;
}

/* Blurred background image */
.header-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;

  background: url('landscape-wide-7d.jpg') center/cover no-repeat;

  filter: blur(12px);
  transform: scale(1.3);
  opacity: 0.7;

  z-index: 0;
}

/* Content above blur */
.logo, .search {
  position: relative;
  z-index: 2;
}

.logo img {
  height: 40px;
}

.search img {
  height: 28px;
}

/* 🔥 HEADER TO CAROUSEL GRADIENT BRIDGE */
.header::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 0;
  width: 100%;
  height: 90px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.75),
    rgba(0,0,0,0)
  );

  z-index: 1;
  pointer-events: none;
}

/* ================= MAIN ================= */
.main {
  margin-top: 60px;
}

/* ================= HERO ================= */
.carousel-item video {
  width: 100%;
  height: 60vh;
  object-fit: cover;
}

/* Dark overlay on video */
.carousel-item::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;

  background: linear-gradient(to top, black, transparent);
}

/* ================= ROWS ================= */
.row-title {
  margin: 15px;
  font-size: 18px;
}

.scroll-row {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px;
}

.scroll-row img {
  height: 160px;
  border-radius: 10px;
  transition: transform 0.3s;
}

.scroll-row img:hover {
  transform: scale(1.1);
}

.scroll-row::-webkit-scrollbar {
  display: none;
}

/* ================= MOBILE ================= */
@media (max-width: 600px) {
  .carousel-item video {
    height: 40vh;
  }

  .scroll-row img {
    height: 120px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">

  <div class="header-bg"></div>

  <div class="logo">
    <img src="sitelogo-removebg-preview.png">
  </div>

  <div class="search">
    <a href="Search.html">
      <img src="https://i.ibb.co/mJ0nZzt/search-9-xxl.png">
    </a>
  </div>

</div>

<div class="main">

<!-- HERO CAROUSEL -->
<div id="heroCarousel" class="carousel slide" data-ride="carousel">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <video autoplay muted loop playsinline>
        <source src="video/Avengers Doomsday  Only in Theaters December 18, 2026.mp4">
      </video>
    </div>

    <div class="carousel-item">
      <video autoplay muted loop playsinline>
        <source src="video/Marvel Studios’ Loki Season 2 _ Mid-Season Trailer.mp4">
      </video>
    </div>

  </div>

</div>

<!-- MOVIES -->
<div class="row-title">Latest Movies</div>
<div class="scroll-row">
  <img src="https://picsum.photos/300/400?1">
  <img src="https://picsum.photos/300/400?2">
  <img src="https://picsum.photos/300/400?3">
  <img src="https://picsum.photos/300/400?4">
  <img src="https://picsum.photos/300/400?5">
</div>

<!-- WEB SERIES -->
<div class="row-title">Web Series</div>
<div class="scroll-row">
  <img src="https://picsum.photos/300/400?6">
  <img src="https://picsum.photos/300/400?7">
  <img src="https://picsum.photos/300/400?8">
  <img src="https://picsum.photos/300/400?9">
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
