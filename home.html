<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hashtag Movies</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ================= GLOBAL ================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial, sans-serif;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.header {
  position: fixed;
  top: 0;
  left: 0;

  width: 100%;
  height: 60px;

  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 0 15px;

  z-index: 1000;

  background: transparent;
}

/* REMOVE OLD BACKGROUND */
.header-bg {
  display: none;
}

/* Logo + Search Container */

.logo,
.search {
  position: relative;
  z-index: 2;

  padding: 8px 12px;

  border-radius: 12px;

  /* Blur only behind logo/search */
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  background: rgba(0,0,0,0.25);
}

/* Logo image */
.logo img {
  height: 40px;
}

/* Search image */
.search img {
  height: 28px;
 
}

/* Optional soft bottom fade */
.header::after {
  content: "";
  position: absolute;

  left: 0;
  bottom: -1px;

  width: 100%;
  height: 70px;

  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.4),
    rgba(0,0,0,0)
  );

  pointer-events: none;
}

/* ================= MAIN ================= */

.main{
  margin-top:65px;
}

/* ================= HERO ================= */

.hero {
  position: relative;
  width: 100%;
  height: 85vh;
  overflow: hidden;
  background: #000;
}

/* Video */

.hero video {
  width: 100%;
  height: 100%;

  object-fit: cover;
  object-position: center center;
}

/* Dark overlays */

.hero::before {
  content: "";
  position: absolute;
  inset: 0;

  background:
    linear-gradient(to top,
    rgba(0,0,0,1) 8%,
    rgba(0,0,0,0.4) 40%,
    transparent 65%),

    linear-gradient(to bottom,
    rgba(0,0,0,0.8),
    transparent 20%);

  z-index: 1;
}

/* Content */

.hero-content {
  position: absolute;
  bottom: 70px;
  left: 40px;

  z-index: 2;
  width: 40%;
}

.hero-title {
  font-size: 52px;
  font-weight: bold;
  margin-bottom: 15px;
}

.hero-desc {
  font-size: 16px;
  line-height: 1.6;
  color: #ddd;

  margin-bottom: 22px;
}

/* Buttons */

.hero-buttons {
  display: flex;
  gap: 15px;
}

.play-btn,
.info-btn {
  border: none;
  padding: 12px 26px;
  border-radius: 5px;

  font-weight: bold;
  cursor: pointer;

  transition: 0.3s;
}

.play-btn {
  background: white;
  color: black;
}

.play-btn:hover {
  background: #ddd;
}

.info-btn {
  background: rgba(109,109,110,0.7);
  color: white;

  backdrop-filter: blur(10px);
}

.info-btn:hover {
  background: rgba(140,140,140,0.6);
}

/* ================= TABLET ================= */

@media (max-width: 992px) {

  .hero {
    height: 65vh;
  }

  .hero-content {
    width: 60%;
    left: 25px;
    bottom: 45px;
  }

  .hero-title {
    font-size: 36px;
  }

}

/* ================= MOBILE ================= */

@media (max-width: 768px) {

  .hero {
    height: 55vh;
  }

  .hero video {

    /* Better mobile framing */
    object-fit: cover;

    /* Focus center */
    object-position: center center;
  }

  .hero-content {

    width: 92%;

    left: 15px;
    bottom: 30px;
  }

  .hero-title {
    font-size: 26px;
    margin-bottom: 10px;
  }

  .hero-desc {
    font-size: 13px;
    line-height: 1.4;
    margin-bottom: 16px;
  }

  .hero-buttons {
    gap: 10px;
  }

  .play-btn,
  .info-btn {
    padding: 9px 18px;
    font-size: 13px;
  }

}

/* ================= SECTION ================= */

.section{
  margin-top:20px;
}

.row-title{
  font-size:20px;
  font-weight:bold;
  margin-left:15px;
  margin-bottom:10px;
}

/* ================= SCROLL ROW ================= */

.scroll-row{
  display:flex;
  gap:12px;

  overflow-x:auto;
  overflow-y:hidden;

  padding:10px 15px 20px;
  scroll-behavior:smooth;
}

.scroll-row::-webkit-scrollbar{
  display:none;
}

.movie-card{
  flex:0 0 auto;
  transition:.35s;
}

.movie-card img{
  width:120px;
  height:180px;

  object-fit:cover;

  border-radius:10px;
}

/* Hover effect */

.movie-card:hover{
  transform:scale(1.08);
}

/* ================= MOBILE ================= */

@media(max-width:768px){

  .carousel-item video{
    height:45vh;
  }

  .movie-card img{
    width:100px;
    height:150px;
  }

  .row-title{
    font-size:18px;
  }

  .logo img{
    height:36px;
  }

}

/* ================= DESKTOP ================= */

@media(min-width:1200px){

  .movie-card img{
    width:150px;
    height:220px;
  }

}

</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
