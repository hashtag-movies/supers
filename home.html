<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hashtag Movies</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

<style>

/* ===== GLOBAL ===== */
body {
  margin: 0;
  background: #000;
  color: #fff;
  font-family: Arial;
}

/* ===== HEADER ===== */
.header {
  position: fixed;
  top: 0;
  width: 100%;
  

  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;

  z-index: 1000;
  overflow: hidden;
     height: 50px;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.6),
    rgba(0,0,0,0)
  );
}

/* 🔥 BLURRED BACKGROUND IMAGE */
.header-bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 110%;
height: 110%;

  background: url('landscape-wide-7d.jpg') center/cover no-repeat;

  filter: blur(10px);
  transform: scale(1.2); /* prevents edge cut */
  opacity: 0.6;
  z-index: 0;
  

}

/* Optional dark overlay for readability */
.header-bg::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
}

/* Keep content above blur */
.logo, .search {
  position: relative;
  z-index: 2;
}

.logo img {
  height: 40px;
}

.search img {
  height: 28px;
}
/* Space below header */
.main {
  margin-top: 60px;
}

/* ===== HERO ===== */
.carousel-item video {
  width: 100%;
  height: 60vh;
  object-fit: cover;
}

/* Dark overlay like Netflix */
.carousel-item::after {
  content: "";
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  background: linear-gradient(to top, black, transparent);
}

/* ===== ROWS ===== */
.row-title {
  margin: 15px;
  font-size: 18px;
}

.scroll-row {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  padding: 10px;
}

.scroll-row img {
  height: 160px;
  border-radius: 10px;
  transition: transform 0.3s;
}

.scroll-row img:hover {
  transform: scale(1.1);
}

/* Hide scrollbar */
.scroll-row::-webkit-scrollbar {
  display: none;
}

/* ===== MOBILE ===== */
@media (max-width: 600px) {
  .carousel-item video {
    height: 40vh;
  }

  .scroll-row img {
    height: 120px;
  }
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  
  <!-- background image layer -->
  <div class="header-bg"></div>

  <!-- content -->
  <div class="logo">
    <img src="sitelogo-removebg-preview.png">
  </div>

  <div class="search">
    <a href="Search.html">
      <img src="https://i.ibb.co/mJ0nZzt/search-9-xxl.png">
    </a>
  </div>

</div>

<div class="main">

<!-- HERO CAROUSEL -->
<div id="heroCarousel" class="carousel slide" data-ride="carousel">

  <div class="carousel-inner">

    <div class="carousel-item active">
      <video autoplay muted loop playsinline poster="poster1.jpg">
        <source src="video/Avengers Doomsday  Only in Theaters December 18, 2026.mp4" type="video/mp4">
      </video>
    </div>

    <div class="carousel-item">
      <video autoplay muted loop playsinline poster="poster2.jpg">
        <source src="video/Marvel Studios’ Loki Season 2 _ Mid-Season Trailer.mp4" type="video/mp4">
      </video>
    </div>

  </div>

</div>

<!-- MOVIE ROW -->
<div class="row-title">Latest Movies</div>
<div class="scroll-row">
  <img src="https://picsum.photos/1600/400/?image=67">
  <img src="https://picsum.photos/1600/400/?image=686">
  <img src="https://picsum.photos/1600/400/?image=696">
  <img src="https://picsum.photos/1600/400/?image=67">
  <img src="https://picsum.photos/1600/400/?image=686">
  <img src="https://picsum.photos/1600/400/?image=696">
  <img src="https://i.ibb.co/dpT72Lt/Adobe-Express-20240219-2122290-1.png" alt="Adobe-Express-20240708-1437050-1">
</div>

<!-- WEB SERIES -->
<div class="row-title">Web Series</div>
<div class="scroll-row">
 <img src="https://picsum.photos/1600/400/?image=696">
  <img src="https://picsum.photos/1600/400/?image=67">
  <img src="https://picsum.photos/1600/400/?image=686">
  <img src="https://picsum.photos/1600/400/?image=696">
  <img src="https://picsum.photos/1600/400/?image=696" alt="Adobe-Express-20240708-1437050-1">
  <img src="img7.jpg">
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
  document.querySelectorAll('.hero-video').forEach(video => {
  video.addEventListener('ended', () => {
    $('#heroCarousel').carousel('next');
  });
});
</script>
</body>
</html>
