<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Hybrid Slider + Carousel</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  font-family: Arial;
}

/* CAROUSEL */
.app {
  position: absolute;
  inset: 0;
}

.slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: 0.8s;
}

.slide.active {
  opacity: 1;
}

.slide:nth-child(1) {
  background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/city22222.jpg') center/cover;
}

.slide:nth-child(2) {
  background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/forest.jpg') center/cover;
}

.slide:nth-child(3) {
  background: linear-gradient(#111, #444);
}

.slide:nth-child(4) {
  background: linear-gradient(#222, #666);
}

/* SLIDER */
.floating-buttons {
  position: fixed;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.slider-btn {
  width: 60px;
  height: 60px;
  border-radius: 50%;
  background: rgba(255,255,255,0.1);
  color: white;
  border: 1px solid #fff2;
  cursor: pointer;
}
</style>
</head>

<body>

<div class="app">
  <div class="slide active"></div>
  <div class="slide"></div>
  <div class="slide"></div>
  <div class="slide"></div>
</div>

<div class="floating-buttons">
  <button class="slider-btn" data-i="0">1</button>
  <button class="slider-btn" data-i="1">2</button>
  <button class="slider-btn" data-i="2">3</button>
  <button class="slider-btn" data-i="3">4</button>
</div>

<script>
const slides = document.querySelectorAll(".slide");
const buttons = document.querySelectorAll(".slider-btn");

function show(i){
  slides.forEach(s => s.classList.remove("active"));
  slides[i].classList.add("active");
}

buttons.forEach(btn => {
  btn.addEventListener("click", () => {
    show(+btn.dataset.i);
  });
});
</script>

</body>
</html>
