<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Animated Slider</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">

<style>
html {
  box-sizing: border-box;
}

*,
*:before,
*:after {
  box-sizing: inherit;
  margin: 0;
  padding: 0;
}

.cont {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(to left bottom, #F2E3C6 0%, #A7A1A5 100%);
  overflow: hidden;
}

.app {
  position: relative;
  min-width: 850px;
  height: 540px;
  box-shadow: 0 0 60px rgba(0,0,0,.3);
  overflow: hidden;
}

.app__bgimg {
  position: absolute;
  top: 0;
  left: -2.5%;
  width: 105%;
  height: 100%;
  transition: transform 3.5s 770ms;
}

.app__bgimg-image {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

.app__bgimg-image--1 {
  background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/city22222.jpg') center center no-repeat;
  background-size: cover;
}

.app__bgimg-image--2 {
  background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/forest.jpg') center center no-repeat;
  background-size: cover;
  opacity: 0;
  transition: opacity 0ms 1300ms;
}

.app__text {
  position: absolute;
  right: 165px;
  top: 150px;
  font-family: 'Roboto', sans-serif;
  text-transform: uppercase;
  z-index: 1;
}

.app__text-line {
  transition: transform 1500ms 400ms, opacity 750ms 500ms;
  user-select: none;
}

.app__text-line--4 {
  font-size: 50px;
  font-weight: 700;
  color: #0A101D;
}

.app__text-line--3 {
  font-size: 40px;
  font-weight: 300;
}

.app__text-line--2 {
  margin-top: 10px;
  font-size: 14px;
  font-weight: 500;
  color: #0099CC;
}

.app__text-line--1 {
  margin-top: 15px;
}

.app__text-line--1 img {
  width: 50px;
}

.app__text--1 .app__text-line {
  transform: translate3d(0, -125px, 0);
  opacity: 0;
}

.app__text--2 {
  right: initial;
  top: 250px;
  left: 80px;
  z-index: -1;
  transition: z-index 1500ms;
}

.app__text--2 .app__text-line {
  opacity: 0;
}

.app__img {
  position: absolute;
  transform: translate3d(0, -750px, 0);
  width: 850px;
  height: 100%;
  transition: transform 3s cubic-bezier(0.6, 0.13, 0.31, 1.02);
}

.app__img img {
  min-width: 100%;
  user-select: none;
}

.initial .app__img {
  transform: translate3d(0, 0, 0);
}

.initial .app__text--1 .app__text-line {
  transform: translate3d(0, 0, 0);
  opacity: 1;
}

.active .app__bgimg {
  transform: translate3d(10px, 0, 0) scale(1.05);
  transition: transform 5s 850ms ease-in-out;
}

.active .app__bgimg-image--2 {
  opacity: 1;
}

.active .app__img {
  transform: translate3d(0, -1410px, 0);
}

.active .app__text--1 {
  z-index: -1;
}

.active .app__text--1 .app__text-line {
  transform: translate3d(0, -125px, 0);
  opacity: 0;
}

.active .app__text--2 {
  z-index: 1;
}

.active .app__text--2 .app__text-line {
  transform: translate3d(0, -125px, 0);
  opacity: 1;
}

.mouse {
  position: relative;
  margin-right: 20px;
  min-width: 50px;
  height: 80px;
  border-radius: 30px;
  border: 5px solid rgba(255, 255, 255, .8);
}

.mouse:after {
  content: '';
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translate(-50%, 0);
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background-color: #fff;
  animation: scroll 1s infinite alternate;
}

@keyframes scroll {
  100% {
    transform: translate(-50%, 15px);
  }
}

.pages {
  margin-left: 20px;
}

.pages__list {
  list-style-type: none;
}

.pages__item {
  position: relative;
  margin-bottom: 10px;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  border: 3px solid #fff;
  cursor: pointer;
}

.pages__item:after {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0,0);
  width: 75%;
  height: 75%;
  border-radius: 50%;
  background-color: #fff;
  opacity: 0;
  transition: 500ms;
}

.pages__item:hover:after {
  transform: translate(-50%, -50%) scale(1,1);
  opacity: 1;
}

.page__item-active:after {
  transform: translate(-50%, -50%) scale(1,1);
  opacity: 1;
}

.icon-link {
  position: absolute;
  left: 5px;
  bottom: 5px;
  width: 50px;
}

.icon-link img {
  width: 100%;
}

.icon-link--twitter {
  left: auto;
  right: 5px;
}


     /* RIGHT SIDE BUTTONS */
    .floating-buttons{
      position:fixed;
      right:5px;
      top:50%;
      transform:translateY(-50%);
      display:flex;
      flex-direction:column;
      gap:10px;
      z-index:999;
    }

    /* CONTAINER */
    .slider-container{
      width:260px;
      height:70px;
      position:relative;
      overflow:hidden;
    }

    /* SLIDE TRACK */
    .slider-track{
      position:absolute;
      right:0;
      top:0;
      width:255px;
      height:62px;
      border-radius:50px;

      /* BLUR EFFECT */
      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);

      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);

      display:flex;
      align-items:center;
      justify-content:center;

      color:white;
      font-size:18px;

      opacity:0;
      transition:0.3s;
    }

    /* ROUND BUTTON */
    .slider-btn{
      width:62px;
      height:62px;
      border-radius:50%;

      position:absolute;
      right:0;
      top:0;

      cursor:pointer;

      display:flex;
      justify-content:center;
      align-items:center;
      text-align:center;

      color:white;
      font-size:13px;
      font-weight:bold;

      user-select:none;
      touch-action:none;

      z-index:2;

      /* ONLY BLUR */
      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      background:rgba(255,255,255,0.05);
      border:1px solid rgba(255,255,255,0.12);

      
      transition:right 0.2s ease;
    }

    /* SHOW TRACK */
    .slider-container:hover .slider-track{
      opacity:1;
    }

    @media(max-width:600px){

      .slider-container{
        width:220px;
      }

      .slider-track{
        width:220px;
        font-size:18px;
      }

      .slider-btn{
        width:62px;
        height:62px;
        font-size:16px;
      }
    }

    button:focus {
  outline: none;
      }
</style>
</head>

<body>

<div class="cont">
  <div class="mouse"></div>

  <div class="app">
    <div class="app__bgimg">
      <div class="app__bgimg-image app__bgimg-image--1"></div>
      <div class="app__bgimg-image app__bgimg-image--2"></div>
    </div>

    <div class="app__img">
      <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/whiteTest4.png" alt="city" />
    </div>

    <div class="app__text app__text--1">
      <div class="app__text-line app__text-line--4">imperdiet</div>
      <div class="app__text-line app__text-line--3">ut le</div>
      <div class="app__text-line app__text-line--2">non tincidunt</div>
      <div class="app__text-line app__text-line--1">
        <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/opus-attachment.png" alt="" />
      </div>
    </div>

    <div class="app__text app__text--2">
      <div class="app__text-line app__text-line--4">habitant</div>
      <div class="app__text-line app__text-line--3">ut eget</div>
      <div class="app__text-line app__text-line--2">Nam imperdiet</div>
      <div class="app__text-line app__text-line--1">
        <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/opus-attachment.png" alt="" />
      </div>
    </div>
  </div>

  <div class="pages">
    <ul class="pages__list">
      <li data-target="1" class="pages__item pages__item--1 page__item-active"></li>
      <li data-target="2" class="pages__item pages__item--2"></li>
    </ul>
  </div>
</div>

<a href="https://dribbble.com/shots/2936160-Opus-Animation" target="_blank" class="icon-link">
  <img src="http://icons.iconarchive.com/icons/uiconstock/socialmedia/256/Dribbble-icon.png">
</a>

<a href="https://twitter.com/mrspok407" target="_blank" class="icon-link icon-link--twitter">
  <img src="https://cdn1.iconfinder.com/data/icons/logotypes/32/twitter-128.png">
</a>



   <div class="floating-buttons">

    <!-- GOOGLE -->
    <div class="slider-container">
      <div class="slider-track">Phase 1</div>
      <div class="slider-btn" data-url="https://google.com">
        1
      </div>
    </div>

    <!-- YOUTUBE -->
    <div class="slider-container">
      <div class="slider-track">Phase 2</div>
      <div class="slider-btn" data-url="https://youtube.com">
        2
      </div>
    </div>

    <!-- FACEBOOK -->
    <div class="slider-container">
      <div class="slider-track">Phase 3</div>
      <div class="slider-btn" data-url="https://facebook.com">
        3
      </div>
    </div>

    <!-- OPENAI -->
    <div class="slider-container">
      <div class="slider-track">Phase 4</div>
      <div class="slider-btn" data-url="https://openai.com">
        4
      </div>
    </div>

    <div class="slider-container">
      <div class="slider-track">Phase 5</div>
      <div class="slider-btn" data-url="https://openai.com">
        5
      </div>
    </div>

    <div class="slider-container">
      <div class="slider-track">Phase 6</div>
      <div class="slider-btn" data-url="https://openai.com">
        6
      </div>
    </div>

  </div>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(document).ready(function () {

  const $app = $('.app');
  let animation = true;
  let curSlide = 1;
  let scrolledUp, nextSlide;

  let pagination = function (slide, target) {

    animation = true;

    if (target === undefined) {
      nextSlide = scrolledUp ? slide - 1 : slide + 1;
    } else {
      nextSlide = target;
    }

    $('.pages__item--' + nextSlide).addClass('page__item-active');
    $('.pages__item--' + slide).removeClass('page__item-active');

    $app.toggleClass('active');

    setTimeout(function () {
      animation = false;
    }, 3000);
  };

  let navigateDown = function () {
    if (curSlide > 1) return;
    scrolledUp = false;
    pagination(curSlide);
    curSlide++;
  };

  let navigateUp = function () {
    if (curSlide === 1) return;
    scrolledUp = true;
    pagination(curSlide);
    curSlide--;
  };

  setTimeout(function () {
    $app.addClass('initial');
  }, 1500);

  setTimeout(function () {
    animation = false;
  }, 4500);

  $(document).on('wheel', function (e) {

    if (animation) return;

    if (e.originalEvent.deltaY < 0) {
      navigateUp();
    } else {
      navigateDown();
    }
  });

  $(document).on("click", ".pages__item:not(.page__item-active)", function () {

    if (animation) return;

    let target = +$(this).attr('data-target');

    pagination(curSlide, target);

    curSlide = target;
  });

});



    const sliders = document.querySelectorAll(".slider-btn");

    sliders.forEach(slider => {

      let isDragging = false;
      let startX = 0;
      let maxMove = 0;

      const container = slider.parentElement;
      const track = container.querySelector(".slider-track");

      function startDrag(clientX){
        isDragging = true;
        startX = clientX;

        maxMove = container.offsetWidth - slider.offsetWidth;

        slider.style.transition = "none";
        track.style.opacity = "1";
      }

      function moveDrag(clientX){
        if(!isDragging) return;

        let moveX = startX - clientX;

        if(moveX < 0) moveX = 0;
        if(moveX > maxMove) moveX = maxMove;

        slider.style.right = moveX + "px";

        // OPEN URL
        if(moveX >= maxMove - 10){
          window.location.href = slider.dataset.url;
        }
      }

      function stopDrag(){
        if(!isDragging) return;

        isDragging = false;

        slider.style.transition = "right 0.25s ease";
        slider.style.right = "0px";

        track.style.opacity = "0";
      }

      /* DESKTOP */
      slider.addEventListener("mousedown", (e)=>{
        startDrag(e.clientX);
      });

      document.addEventListener("mousemove", (e)=>{
        moveDrag(e.clientX);
      });

      document.addEventListener("mouseup", stopDrag);

      /* MOBILE */
      slider.addEventListener("touchstart", (e)=>{
        startDrag(e.touches[0].clientX);
      });

      document.addEventListener("touchmove", (e)=>{
        moveDrag(e.touches[0].clientX);
      }, { passive:false });

      document.addEventListener("touchend", stopDrag);

    });
</script>

</body>
</html>
