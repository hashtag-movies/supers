<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Slider</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css?family=Poppins:400,500,600,700,300" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- GSAP (TweenMax) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/2.1.3/TweenMax.min.js"></script>

<style>
/* ====== BASE ====== */
*, *::before, *::after {
  box-sizing: border-box;
}

body, html {
  margin:0;
  padding:2rem;
  background:#E4E0E0;
  font-size:10px;
  font-family:'Poppins', sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* hide svg */
#icons {display:none}

/* ===== HEADER ===== */
.header-wrapper {
  position:absolute;
  top:0;
  left:0;
  width:100%;
  padding:2rem 4rem;
  z-index:20;
}

.menu-hamburger {
  width:1.3rem;
  height:0.2rem;
  background:black;
  position:relative;
}
.menu-hamburger::before,
.menu-hamburger::after {
  content:"";
  position:absolute;
  width:1.3rem;
  height:0.2rem;
  background:black;
}
.menu-hamburger::before {top:-0.4rem}
.menu-hamburger::after {top:0.4rem}

/* ===== SLIDER ===== */
.slider-content {
  position:relative;
  max-width:1100px;
  margin:auto;
  background:white;
  overflow:hidden;
  box-shadow:0 0 30px rgba(0,0,0,0.2);
}

.slider-container {
  position:relative;
  height:60rem;
  overflow:hidden;
}

.slide {
  position:absolute;
  width:100%;
  height:100%;
  display:flex;
}

.slide-content {
  width:50%;
  transition:0.4s;
}

.slide-content.txt {
  padding:5rem;
  display:flex;
  align-items:center;
}

.slide-content img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.copy {opacity:0}
.active .copy {opacity:1}

/* NAV */
.nav-wrapper {
  position:absolute;
  right:0;
  top:50%;
  transform:translateY(-50%);
  z-index:10;
  padding:2rem;
  text-align:center;
}

.nav-up, .nav-down {
  cursor:pointer;
}

/* NUMBER */
.number-wrapper {
  position:absolute;
  left:0;
  top:50%;
  transform:translateY(-50%);
  font-size:5rem;
  opacity:0.2;
  padding:2rem;
}
</style>
</head>

<body>

<!-- SVG -->
<svg id="icons">
<symbol id="icon-arrow" viewBox="0 0 476.213 476.213">
<polygon points="347.5,324.393 253.353,418.541 253.353,0 223.353,0 223.353,419.033 128.713,324.393 107.5,345.607 238.107,476.213 368.713,345.606"/>
</symbol>
</svg>

<div class="number-wrapper"><div class="number">01</div></div>

<div class="nav-wrapper">
  <div class="nav-up">▲</div>
  <div class="nav-down">▼</div>
</div>

<div class="slider-content">

  <div class="slider-container">

    <div class="slide active">
      <div class="slide-content txt">
        <div>
          <span class="copy">Intro</span>
          <h2>Hello I’m Mr.Bara</h2>
        </div>
      </div>
      <div class="slide-content">
        <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/42764/slider1.jpg">
      </div>
    </div>

    <div class="slide">
      <div class="slide-content txt">
        <span class="copy">Slide 2</span>
      </div>
      <div class="slide-content">
        <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/42764/slide2.jpg">
      </div>
    </div>

  </div>
</div>

<script>
const up = $('.nav-up');
const down = $('.nav-down');
let counter = 1;
let number = $('.number');

function moveDown(currentSlide) {

  let nextSlide = currentSlide.next();

  if(nextSlide.length) {

    counter++;

    number.text("0"+counter);

    TweenMax.to(currentSlide, 0.5, {y:"-100%"});
    TweenMax.to(nextSlide, 0.5, {y:"0%"});

    currentSlide.removeClass("active");
    nextSlide.addClass("active");
  }
}

function moveUp(currentSlide) {

  let prevSlide = currentSlide.prev();

  if(prevSlide.length) {

    counter--;

    number.text("0"+counter);

    TweenMax.to(currentSlide, 0.5, {y:"100%"});
    TweenMax.to(prevSlide, 0.5, {y:"0%"});

    currentSlide.removeClass("active");
    prevSlide.addClass("active");
  }
}

down.on("click", function(){
  moveDown($(".active"));
});

up.on("click", function(){
  moveUp($(".active"));
});
</script>

</body>
</html>
