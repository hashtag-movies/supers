<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Responsive Animated Slider</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow-x: hidden;
  font-family: 'Roboto', sans-serif;
}

.cont {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background: linear-gradient(to left bottom, #F2E3C6 0%, #A7A1A5 100%);
  overflow: hidden;
}

/* MAIN APP */
.app {
  position: relative;
  width: 90%;
  max-width: 850px;
  height: 540px;
  box-shadow: 0 0 60px rgba(0,0,0,.3);
  overflow: hidden;
}

/* BACKGROUND */
.app__bgimg {
  position: absolute;
  top: 0;
  left: -2.5%;
  width: 105%;
  height: 100%;
  transition: transform 3.5s 770ms;
}

.app__bgimg-image {
  position: absolute;
  width: 100%;
  height: 100%;
}

.app__bgimg-image--1 {
  background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/city22222.jpg') center/cover no-repeat;
}

.app__bgimg-image--2 {
  background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/forest.jpg') center/cover no-repeat;
  opacity: 0;
  transition: opacity 0ms 1300ms;
}

/* TEXT */
.app__text {
  position: absolute;
  right: 165px;
  top: 150px;
  text-transform: uppercase;
  z-index: 2;
  transition: all 1s ease;
}

.app__text-line {
  transition: transform 1500ms 400ms, opacity 750ms 500ms;
}

.app__text-line--4 { font-size: 50px; font-weight: 700; }
.app__text-line--3 { font-size: 40px; font-weight: 300; }
.app__text-line--2 { font-size: 14px; color: #0099CC; margin-top: 10px; }

.app__text--1 .app__text-line {
  transform: translateY(0);
  opacity: 1;
}

/* IMAGE */
.app__img {
  position: absolute;
  width: 850px;
  height: 100%;
  transform: translateY(-750px);
  transition: transform 3s cubic-bezier(0.6, 0.13, 0.31, 1.02);
}

.app__img img {
  width: 100%;
  height: auto;
}

/* ACTIVE STATE */
.active .app__bgimg {
  transform: scale(1.05);
}

.active .app__bgimg-image--2 {
  opacity: 1;
}

.active .app__img {
  transform: translateY(-1410px);
}

/* PAGES */
.pages {
  position: absolute;
  right: 20px;
  top: 50%;
  transform: translateY(-50%);
}

.pages__item {
  width: 20px;
  height: 20px;
  margin: 10px 0;
  border-radius: 50%;
  border: 2px solid #fff;
  cursor: pointer;
}

.page__item-active {
  background: #fff;
}

/* TOUCH / MOUSE */
.mouse {
  position: absolute;
  left: 20px;
  bottom: 20px;
  width: 40px;
  height: 70px;
  border: 3px solid #fff;
  border-radius: 20px;
}

/* RESPONSIVE */
@media (max-width: 768px) {

  .app {
    height: 420px;
  }

  .app__text {
    top: 60px;
    left: 20px;
    right: 20px;
    text-align: center;
  }

  .app__text-line--4 { font-size: 30px; }
  .app__text-line--3 { font-size: 22px; }
  .app__text-line--2 { font-size: 12px; }

  .pages {
    top: auto;
    bottom: 15px;
    right: 50%;
    transform: translateX(50%);
    display: flex;
    gap: 10px;
  }

  .mouse {
    display: none;
  }
}

@media (max-width: 480px) {
  .app {
    height: 360px;
  }

  .app__text-line--4 { font-size: 22px; }
  .app__text-line--3 { font-size: 18px; }
}
</style>
</head>

<body>

<div class="cont">

  <div class="mouse"></div>

  <div class="app">

    <div class="app__bgimg">
      <div class="app__bgimg-image app__bgimg-image--1"></div>
      <div class="app__bgimg-image app__bgimg-image--2"></div>
    </div>

    <div class="app__img">
      <img src="https://s3-us-west-2.amazonaws.com/s.cdpn.io/537051/whiteTest4.png">
    </div>

    <div class="app__text app__text--1">
      <div class="app__text-line app__text-line--4">imperdiet</div>
      <div class="app__text-line app__text-line--3">ut le</div>
      <div class="app__text-line app__text-line--2">non tincidunt</div>
    </div>

    <div class="app__text app__text--2">
      <div class="app__text-line app__text-line--4">habitant</div>
      <div class="app__text-line app__text-line--3">ut eget</div>
      <div class="app__text-line app__text-line--2">Nam imperdiet</div>
    </div>

  </div>

  <div class="pages">
    <div class="pages__item page__item-active" data-target="1"></div>
    <div class="pages__item" data-target="2"></div>
  </div>

</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script>
$(function () {

  const $app = $('.app');
  let animation = false;
  let curSlide = 1;

  function pagination(slide, target) {

    animation = true;

    let nextSlide = target || (slide === 1 ? 2 : 1);

    $('.pages__item').removeClass('page__item-active');
    $('.pages__item[data-target="'+nextSlide+'"]').addClass('page__item-active');

    $app.toggleClass('active');

    setTimeout(() => {
      animation = false;
    }, 3000);
  }

  function navigateDown() {
    if (animation) return;
    if (curSlide === 2) return;
    pagination(curSlide);
    curSlide++;
  }

  function navigateUp() {
    if (animation) return;
    if (curSlide === 1) return;
    pagination(curSlide);
    curSlide--;
  }

  // mouse wheel
  $(document).on('wheel', function (e) {
    if (animation) return;

    if (e.originalEvent.deltaY < 0) navigateUp();
    else navigateDown();
  });

  // click pagination
  $('.pages__item').on('click', function () {
    if (animation) return;

    let target = +$(this).data('target');
    pagination(curSlide, target);
    curSlide = target;
  });

  // touch swipe support
  let startY = 0;

  $(document).on('touchstart', function (e) {
    startY = e.originalEvent.touches[0].clientY;
  });

  $(document).on('touchend', function (e) {

    if (animation) return;

    let endY = e.originalEvent.changedTouches[0].clientY;

    if (startY > endY + 30) navigateDown();
    else if (startY < endY - 30) navigateUp();
  });

  // initial animation
  setTimeout(() => {
    $app.addClass('initial');
  }, 800);

});
</script>

</body>
</html>
